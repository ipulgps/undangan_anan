<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- ============================================================
       META PREVIEW (WhatsApp, Facebook, Telegram, Twitter/X, dll)
       ============================================================
       PENTING: WhatsApp TIDAK menjalankan JavaScript saat membuat
       preview. Jadi meta di bawah ini WAJIB statis di sini — meta
       yang di-set dari src/config/invitation.js lewat App.vue hanya
       berpengaruh pada tab browser, bukan pada preview WhatsApp.

       >>> YANG HARUS DIGANTI SAAT SUDAH PUNYA DOMAIN: <<<
       Ganti SEMUA "https://undangan-anan-sarah.vercel.app" di file
       ini dengan URL asli undangan (tanpa garis miring di akhir).
       og:image HARUS URL absolut (https://...), path relatif seperti
       "/og-image.jpg" tidak akan tampil di WhatsApp.
       ============================================================ -->

  <title>Anan &amp; Sarah — Wedding Invitation</title>
  <meta name="description" content="The Wedding of Anan &amp; Sarah — Sabtu, 27 September 2026 di Gedung Pariwisata Kota Kendari. Merupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir." />
  <meta name="author" content="Anan &amp; Sarah" />
  <meta name="theme-color" content="#062820" />
  <link rel="canonical" href="https://undangan-anan-sarah.vercel.app/" />

  <!-- Open Graph — dipakai WhatsApp, Facebook, Telegram, LinkedIn -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Anan &amp; Sarah Wedding" />
  <meta property="og:locale" content="id_ID" />
  <meta property="og:url" content="https://undangan-anan-sarah.vercel.app/" />
  <meta property="og:title" content="The Wedding of Anan &amp; Sarah — 27 September 2026" />
  <meta property="og:description" content="Merupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa dan restu. Sabtu, 27 September 2026 · Gedung Pariwisata Kota Kendari." />
  <meta property="og:image" content="https://undangan-anan-sarah.vercel.app/og-image.jpg" />
  <meta property="og:image:secure_url" content="https://undangan-anan-sarah.vercel.app/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Anan &amp; Sarah — 27 September 2026" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="The Wedding of Anan &amp; Sarah — 27 September 2026" />
  <meta name="twitter:description" content="Merupakan suatu kehormatan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa dan restu." />
  <meta name="twitter:image" content="https://undangan-anan-sarah.vercel.app/og-image.jpg" />
  <meta name="twitter:image:alt" content="Anan &amp; Sarah — 27 September 2026" />

  <!-- Data terstruktur acara (Google & beberapa aplikasi chat) -->

    "@context": "https://schema.org",

    "startDate": "2026-09-27T08:00:00+07:00",

      "@type": "Place",

      }
    }
